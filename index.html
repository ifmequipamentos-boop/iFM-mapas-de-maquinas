<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#13263a;font:16px system-ui}header{background:#10283e;color:white;padding:25px max(5vw,16px);border-bottom:4px solid #24c0aa}header small{color:#7de0d3;letter-spacing:.18em}h1{margin:6px 0}main{max-width:1120px;margin:auto;padding:22px 16px}section,dialog{background:white;border:1px solid #d7e2eb;border-radius:14px;padding:18px;margin-bottom:16px}dialog{width:min(620px,94vw);margin:auto;max-height:90vh}dialog::backdrop{background:#10283e99}h2{margin:0 0 12px}.bar,.fields{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.fields label{flex:1 1 155px}label{display:grid;gap:4px;font-size:.88rem}button,input,select{font:inherit;border:1px solid #bacbd9;border-radius:8px;padding:9px;max-width:100%}button{cursor:pointer;background:#e6f0f7;color:#10283e}button.primary{background:#07695e;color:white;border-color:#07695e}button[aria-pressed=true]{background:#10283e;color:white}nav{margin-bottom:16px}.table{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}td,th{border-bottom:1px solid #d7e2eb;padding:9px;vertical-align:top}th{background:#eaf2f8}p{margin:8px 0 14px}img{max-width:130px;max-height:100px}details{margin-top:8px}summary{cursor:pointer}small{color:#526779}@media print{body{background:white}button,nav,.filters,.hint,dialog{display:none!important}header{background:white;color:black;padding:0}main{padding:0}section{border:0}.table{overflow:visible}}
#welcome{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#10283e}
#welcome[hidden],#app[hidden]{display:none}
.welcome-card{width:min(100%,420px);margin:0;padding:clamp(22px,6vw,42px);text-align:center;border-top:4px solid #24c0aa}
.welcome-card img{display:block;width:min(100%,240px);max-width:none;max-height:none;height:auto;margin:0 auto 16px}
.welcome-card h1{font-size:clamp(1.4rem,6vw,2rem)}
.welcome-card button{width:100%;min-height:46px;margin-top:6px}
@media print{#welcome{display:none!important}}
.floor{width:min(100%,640px);aspect-ratio:1;min-height:410px;margin:16px auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(28px,.42fr) minmax(0,1fr);gap:8px;border:3px solid #10283e;padding:8px;background:#f4f8fb}
.floor-side{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;min-width:0}
.floor-slot{padding:4px;overflow-wrap:anywhere;font-size:clamp(.74rem,2vw,1rem)}
.floor-slot small{display:block}
.floor-aisle{writing-mode:vertical-rl;display:grid;place-items:center;background:#e3ebf1;color:#526779;font-size:.78rem;letter-spacing:.12em}
@media print{.floor button{display:block!important}.floor{max-width:165mm;break-inside:avoid}}
</style>

    for(const item of m.items){
      if(filters.service&&item.service!==filters.service)continue;
      const fields=[item.type,item.size,item.service,item.drive];
      if(filters.query&&!fields.join(' ').toLocaleLowerCase('pt-BR').includes(filters.query.trim().toLocaleLowerCase('pt-BR')))continue;
      const id=JSON.stringify(fields.map(x=>x.toLocaleLowerCase('pt-BR')));
      if(!groups.has(id))groups.set(id,{fields,total:0,locations:new Map()});
      const group=groups.get(id), place=locationOf(m);
      group.total+=item.qty;
      group.locations.set(place,(group.locations.get(place)||0)+item.qty);
    }
  }
  return [...groups.values()].sort((a,b)=>a.fields.join(' ').localeCompare(b.fields.join(' '),'pt-BR')).map(g=>[...g.fields,g.total,[...g.locations].map(([place,qty])=>place+' ('+qty+')').join('\n')]);
}
const columns=['Equipamento','Tamanho','Serviço','Acionamento','Qtd.','Máquinas'];
function renderMap(){
  const rows=rowsForMap();
  byId('results').innerHTML='<p><strong>'+rows.reduce((n,r)=>n+r[4],0)+'</strong> equipamentos em <strong>'+rows.length+'</strong> configurações</p>'+
    (rows.length?table(columns,rows.map(r=>r.map(v=>esc(v).replace(/\n/g,'<br>')))):'<p>Nenhum equipamento para os filtros selecionados.</p>');
}
function renderFloor(){
  const side=start=>'<div class="floor-side">'+Array.from({length:6},(_,i)=>{
    const slot=start+i, m=machines.find(machine=>machine.slot===slot);
    return button('<small>Posição '+String(slot).padStart(2,'0')+'</small>'+esc(m?.name||'Vincular máquina'),'floor-slot:'+slot,'floor-slot');
  }).join('')+'</div>';
  byId('content').innerHTML='<section><h2>Planta da Fábrica</h2><p class="hint">Toque em uma posição para vincular uma máquina ou abrir sua ficha.</p><div class="floor">'+side(1)+'<div class="floor-aisle">CORREDOR CENTRAL</div>'+side(7)+'</div>'+button('Imprimir / salvar PDF','pdf')+'</section>';
}
function editFloorSlot(slot){
  const index=machines.findIndex(m=>m.slot===slot);
  const dialog=byId('editor');
  const choices=machines.map((m,i)=>'<option value="'+i+'" '+(i===index?'selected':'')+'>'+esc(locationOf(m))+(m.slot&&i!==index?' (posição '+m.slot+')':'')+'</option>').join('');
  dialog.innerHTML='<form><h2>Posição '+String(slot).padStart(2,'0')+'</h2><label>Máquina cadastrada<select name="machine"><option value="">Posição livre</option>'+choices+'</select></label><p class="bar"><button class="primary">Salvar posição</button>'+button('Cancelar','')+(index>=0?button('Abrir ficha','floor-open:'+index):'')+'</p></form>';
  const form=dialog.querySelector('form');
  form.querySelector('[data-action=""]').onclick=()=>dialog.close();
  form.onsubmit=event=>{
    event.preventDefault();
    const value=new FormData(form).get('machine');
    const chosen=value===''?-1:Number(value);
    const next=machines.map((machine,i)=>{
      if(i===chosen)return {...machine,slot};
      if(machine.slot===slot){const copy={...machine};delete copy.slot;return copy}
      return machine;
    });
    if(save(next)){dialog.close();renderFloor()}
  };
  dialog.showModal();
}
function render(){
  byId('tabs').innerHTML=['machines','map','floor'].map((id,i)=>'<button data-action="'+id+'" aria-pressed="'+(mode===id)+'">'+['Máquinas','Mapa Geral','Planta da Fábrica'][i]+'</button>').join('');
  if(mode==='floor'){renderFloor();return}
  if(mode==='map'){
    const defs=[['client','Cliente'],['unit','Unidade'],['sector','Setor'],['name','Máquina'],['service','Serviço']];
    byId('content').innerHTML='<section><h2>Mapa Geral</h2><div class="fields filters">'+defs.map(([k,label])=>'<label>'+label+select(k,k==='service'?services:[...new Set(machines.map(m=>m[k]))].sort(),filters[k],true)+'</label>').join('')+
      '<label>Buscar equipamento<input name="query" placeholder="Ex.: globo DN 80" value="'+esc(filters.query)+'"></label></div><div id="results"></div><p class="bar">'+button('Exportar CSV para Excel','csv','primary')+button('Imprimir / salvar PDF','pdf')+'</p></section>';
    renderMap();return;
  }
  const m=machines[selected];
  byId('content').innerHTML='<section><h2>Máquinas cadastradas</h2><div class="bar"><label>Selecionar máquina<select id="machine">'+machines.map((m,i)=>'<option value="'+i+'" '+(i===selected?'selected':'')+'>'+esc(locationOf(m))+'</option>').join('')+'</select></label>'+button('Nova máquina','new-machine','primary')+'</div></section>'+
    (m?'<section><h2>'+esc(m.name)+'</h2><p>'+esc(locationOf(m))+'</p><div class="bar">'+button('Adicionar equipamento','new-item','primary')+button('Editar máquina','edit-machine')+button('Duplicar máquina','copy-machine')+button('Excluir máquina','delete-machine')+'</div></section><section><h2>Equipamentos instalados</h2>'+
    (m.items.length?table([...columns.slice(0,5),'Ações'],m.items.map((it,i)=>[
      esc(it.type)+([it.brand,it.model,it.point,it.photo].some(Boolean)?'<details><summary>Detalhes</summary>'+[it.brand,it.model,it.point].filter(Boolean).map(esc).join(' · ')+(it.photo?'<div><img alt="Foto do equipamento" src="'+esc(it.photo)+'"></div>':'')+'</details>':''),
      ...[it.size,it.service,it.drive,it.qty].map(esc),button('Editar','edit-item:'+i)+' '+button('Excluir','delete-item:'+i)
    ])):'<p>Adicione o primeiro equipamento desta máquina.</p>')+'</section>':'');
}
const field=(label,name,value='',optional=false)=>'<label>'+label+'<input name="'+name+'" value="'+esc(value)+'" '+(optional?'':'required')+'></label>';
function form(action,index){
  const m=machines[selected], machine=action.endsWith('machine'), copy=action==='copy-machine';
  const data=machine?(action==='new-machine'?{}:m):(m.items[index]||{});
  const html=machine?field('Cliente','client',data.client)+field('Unidade','unit',data.unit)+field('Setor','sector',data.sector)+field('Nome da máquina','name',copy?data.name+' (cópia)':data.name):
    field('Tipo de equipamento','type',data.type)+field('Tamanho (DN ou polegadas)','size',data.size)+'<label>Serviço'+select('service',services,data.service,false)+'</label>'+
    field('Acionamento','drive',data.drive)+'<label>Quantidade<input name="qty" type="number" min="1" max="999999" step="1" required value="'+esc(data.qty??1)+'"></label>'+
    field('Fabricante','brand',data.brand,true)+field('Modelo','model',data.model,true)+field('Ponto de instalação','point',data.point,true)+'<label>Foto opcional<input type="file" name="photo" accept="image/*"></label>';
  const dialog=byId('editor');
  dialog.innerHTML='<form><h2>'+(machine?(copy?'Duplicar máquina':'Cadastro da máquina'):'Cadastro do equipamento')+'</h2><div class="fields">'+html+'</div><p class="bar"><button class="primary">Salvar</button><button type="button" id="cancel">Cancelar</button></p></form>';
  byId('cancel').onclick=()=>dialog.close();
  dialog.querySelector('form').onsubmit=async event=>{
    event.preventDefault();
    const submit=event.submitter;submit.disabled=true;
    try{
      const values=Object.fromEntries(new FormData(event.currentTarget));
      const next=JSON.parse(JSON.stringify(machines));
      const chosen=next[selected];
      let nextSelected=selected;
      for(const k in values)if(typeof values[k]==='string')values[k]=values[k].trim();
      if((machine?['client','unit','sector','name']:['type','size','drive']).some(k=>!values[k])){alert('Preencha os campos obrigatórios.');return}
      if(machine){
        const editing=action==='edit-machine';
        if(next.some((other,i)=>(!editing||i!==selected)&&locationOf(other).toLowerCase()===locationOf(values).toLowerCase())){alert('Já existe uma máquina com esse nome nesse local.');return}
        values.items=editing||copy?chosen.items:[];
        if(editing)next[selected]={...values,slot:chosen.slot};
        else{nextSelected=next.length;next.push(values)}
      }else{
        const file=values.photo;
        values.photo=data.photo||'';
        if(file.size){
          if(!file.type.startsWith('image/')||file.size>1500000){alert('Escolha uma imagem de até 1,5 MB.');return}
          values.photo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});
        }
        values.qty=Number(values.qty);
        if(action==='edit-item')chosen.items[index]=values;
        else chosen.items.push(values);
      }
      if(save(next)){selected=nextSelected;dialog.close();render()}
    }catch{alert('O cadastro não pôde ser salvo. Verifique a foto e tente novamente.')}
    finally{submit.disabled=false}
  };
  dialog.showModal();
}
document.addEventListener('click',event=>{
  const value=event.target.closest('[data-action]')?.dataset.action;
  if(!value)return;
  const [action,n]=value.split(':'), index=Number(n);
  if(['machines','map','floor'].includes(action)){mode=action;render()}
  else if(action==='floor-slot')editFloorSlot(index);
  else if(action==='floor-open'){byId('editor').close();selected=index;mode='machines';render()}
  else if(action==='pdf')window.print();
  else if(action==='csv'){
    const csv=[columns,...rowsForMap()].map(row=>row.map(v=>{
      const s=String(v);
      return '"'+(/^[\s]*[=+@-]/.test(s)?"'":'')+s.replace(/"/g,'""')+'"';
    }).join(';')).join('\r\n');
    const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));
    const link=document.createElement('a');link.href=url;link.download='MAS_Mapa_Geral.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }else if(action.startsWith('delete')){
    if(!confirm(action==='delete-machine'?'Excluir esta máquina e todos os seus equipamentos?':'Excluir este equipamento?'))return;
    const next=JSON.parse(JSON.stringify(machines));
    if(action==='delete-machine')next.splice(selected,1);
    else next[selected].items.splice(index,1);
    if(save(next)){selected=Math.max(0,Math.min(selected,next.length-1));render()}
  }else form(action,index);
});
byId('content').addEventListener('change',event=>{
  const el=event.target;
  if(el.id==='machine'){selected=Number(el.value);render()}
  else if(el.matches('.filters select')){filters[el.name]=el.value;renderMap()}
});
byId('content').addEventListener('input',event=>{if(event.target.name==='query'){filters.query=event.target.value;renderMap()}});
render();
</script></html>
